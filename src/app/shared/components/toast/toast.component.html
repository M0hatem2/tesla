<div class="fixed bottom-4 right-4 z-50 space-y-2">
  @for (toast of toasts; track toast.id) {
    <div
      class="flex items-center {{
        getColorClass(toast.type)
      }} text-white px-6 py-4 rounded-lg shadow-lg min-w-[300px] animate-slide-in"
    >
      <span class="text-2xl mr-3">{{ getIcon(toast.type) }}</span>
      <p class="flex-1">{{ toast.message }}</p>
      <button (click)="dismiss(toast.id)" class="ml-4 hover:bg-white/20 rounded p-1 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  }
</div>
